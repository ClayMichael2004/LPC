services:
  postgres:
    image: postgres:16-alpine
    container_name: lpc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lpc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lpc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lpc_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lpc_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/lpc_db?sslmode=disable
      REDIS_URL: redis:6379
      JWT_SECRET: little-polo-cafe-secret-key-east-africa-2026
      JWT_EXPIRY_HOURS: 168
      OTP_SENDER_EMAIL: mikewillmakeit2004@gmail.com
      ADMIN_EMAIL: mikewillmakeit2004@gmail.com
      ADMIN_PASSWORD: AdminLPC2026!
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
